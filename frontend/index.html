<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Command Center — El Khabir Academy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- ========== LOGIN GATE (شاشة تسجيل الدخول) ========== -->
    <div id="auth-login" class="auth-login hidden">
      <div class="auth-card">
        <div class="auth-lock">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
        </div>
        <h1 class="auth-title">AI Command Center</h1>
        <p class="auth-subtitle">أدخل كلمة السر للوصول إلى لوحة التحكم</p>
        <form id="auth-form" class="auth-form" autocomplete="off">
          <input
            id="auth-password"
            class="auth-input"
            type="password"
            placeholder="كلمة السر"
            autocomplete="current-password"
            required
          />
          <button id="auth-submit" class="auth-submit" type="submit">دخول</button>
          <p id="auth-error" class="auth-error hidden" role="alert"></p>
        </form>
      </div>
    </div>

    <div id="app" class="app hidden">
      <!-- ========== TOP BAR ========== -->
      <header class="topbar">
        <div class="topbar-left">
          <a href="#/conversations" class="logo" title="AI Command Center">
            <svg class="logo-icon" width="28" height="28" viewBox="0 0 28 28" fill="none">
              <rect width="28" height="28" rx="7" fill="#F97316" />
              <path d="M8 10h12M8 14h8M8 18h10" stroke="#fff" stroke-width="2" stroke-linecap="round" />
            </svg>
            <span class="logo-text">AI Command Center</span>
          </a>

          <button type="button" class="mobile-search-btn icon-btn" id="mobile-search-btn" title="Search">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
          </button>

          <div class="topbar-search" id="topbar-search">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input type="search" class="search-input-topbar" id="global-search" placeholder="Search conversations..." autocomplete="off" />
            <kbd class="search-kbd">Ctrl /</kbd>
          </div>
        </div>

        <button type="button" class="hamburger-btn icon-btn" id="hamburger-btn" title="Menu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
          </button>

        <div class="topbar-right">
          <div class="status-pill">
            <span class="status-dot-green"></span>
            System Online
          </div>

          <button class="icon-btn notification-btn" id="notification-btn" title="Notifications">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
              <path d="M13.73 21a2 2 0 0 1-3.46 0" />
            </svg>
            <span class="notification-badge" id="notification-badge">3</span>
          </button>

          <div class="user-menu" id="user-menu">
            <div class="avatar-circle">T</div>
            <div class="user-info">
              <span class="user-name">Team Admin</span>
              <span class="user-role">Admin</span>
            </div>
            <svg class="chevron-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9" />
            </svg>
          </div>
        </div>
      </header>

      <!-- ========== APP BODY ========== -->
      <div class="app-body">
        <!-- ========== LEFT SIDEBAR ========== -->
        <nav class="sidebar" id="sidebar">
          <ul class="nav-list">
            <li>
              <a href="#/conversations" class="nav-item active" data-route="conversations">
                <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                </svg>
                <span class="nav-text">Conversations</span>
                <span class="nav-badge" id="conv-count-badge">0</span>
              </a>
            </li>
            <li>
              <a href="#/overview" class="nav-item" data-route="overview">
                <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="3" width="7" height="7" />
                  <rect x="14" y="3" width="7" height="7" />
                  <rect x="14" y="14" width="7" height="7" />
                  <rect x="3" y="14" width="7" height="7" />
                </svg>
                <span class="nav-text">Overview</span>
              </a>
            </li>
            <li>
              <a href="#/orders" class="nav-item" data-route="orders">
                <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z" />
                  <line x1="3" y1="6" x2="21" y2="6" />
                  <path d="M16 10a4 4 0 0 1-8 0" />
                </svg>
                <span class="nav-text">Orders</span>
              </a>
            </li>
            <li>
              <a href="#/analytics" class="nav-item" data-route="analytics">
                <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="18" y1="20" x2="18" y2="10" />
                  <line x1="12" y1="20" x2="12" y2="4" />
                  <line x1="6" y1="20" x2="6" y2="14" />
                </svg>
                <span class="nav-text">Analytics</span>
              </a>
            </li>
            <li>
              <a href="#/contacts" class="nav-item" data-route="contacts">
                <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                  <circle cx="9" cy="7" r="4" />
                  <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                  <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                </svg>
                <span class="nav-text">Contacts</span>
              </a>
            </li>
            <li>
              <a href="#/automation" class="nav-item" data-route="automation">
                <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
                </svg>
                <span class="nav-text">Automation</span>
              </a>
            </li>
            <li>
              <a href="#/settings" class="nav-item" data-route="settings">
                <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="3" />
                  <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.32 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
                </svg>
                <span class="nav-text">Settings</span>
              </a>
            </li>
          </ul>

          <div class="sidebar-footer">
            <div class="system-status">
              <span class="status-dot-green"></span>
              <span class="system-status-text">System Status</span>
            </div>
            <span class="system-status-sub">All systems operational</span>
            <button type="button" id="logout-btn" class="logout-btn" title="تسجيل الخروج">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                <polyline points="16 17 21 12 16 7" />
                <line x1="21" y1="12" x2="9" y2="12" />
              </svg>
              <span>تسجيل الخروج</span>
            </button>
          </div>
        </nav>

        <!-- ========== SIDEBAR OVERLAY (mobile drawer) ========== -->
        <div class="sidebar-overlay" id="sidebar-overlay"></div>

        <!-- ========== MAIN CONTENT (Outlet) ========== -->
        <main class="main-content" id="app-outlet"></main>
      </div>
    </div>

    <div id="error-banner" class="banner hidden" role="alert"></div>

    <!-- ========== SCRIPTS ========== -->
    <script src="js/chart.umd.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/router.js"></script>
    <script src="js/shell.js"></script>
    <script src="js/pages/conversations.js"></script>
    <script src="js/pages/overview.js"></script>
    <script src="js/pages/orders.js"></script>
    <script src="js/pages/analytics.js"></script>
    <script src="js/pages/contacts.js"></script>
    <script src="js/pages/automation.js"></script>
    <script src="js/pages/settings.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
